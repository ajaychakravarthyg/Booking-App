# ─────────────────────────────────────────────────────────────────────────────────
# Full stack: PostgreSQL + Eureka + gateway + 3 services + React frontend.
#
#   docker compose up --build          start everything
#   docker compose logs -f api-gateway follow one service
#   docker compose down                stop (keeps data)
#   docker compose down -v             stop and wipe the database
#
# Once healthy:
#   http://localhost:3000   the app
#   http://localhost:8080/swagger-ui.html   all three APIs in one Swagger UI
#   http://localhost:8761   Eureka dashboard
#
# Copy .env.example to .env first to override the defaults below.
# ─────────────────────────────────────────────────────────────────────────────────

name: hotel-booking

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [hotel-net]
  environment: &service-env
    SPRING_PROFILES_ACTIVE: postgres
    DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hotel_booking}
    DB_USERNAME: ${POSTGRES_USER:-hotel}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-hotel}
    # Must be byte-identical across all four Java services: auth-service signs tokens
    # with it, the others verify against it. A mismatch means every request 401s.
    JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-before-deploying-0123456789}
    EUREKA_URL: http://discovery-server:8761/eureka/
    PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  # ── Data tier ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_booking}
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel}
    ports:
      # Exposed for psql / a GUI client. Remove this line to keep the database
      # reachable only from inside the compose network.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates one schema per service. Runs on first initialisation only.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -d and -U matter: without them pg_isready checks the wrong default database and
      # can report ready before the init scripts have finished.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hotel} -d ${POSTGRES_DB:-hotel_booking}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [hotel-net]

  # ── Service registry ───────────────────────────────────────────────────────────
  discovery-server:
    build:
      context: ./discovery-server
    container_name: hotel-discovery
    restart: unless-stopped
    ports:
      - '${EUREKA_PORT:-8761}:8761'
    environment:
      EUREKA_HOSTNAME: discovery-server
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8761/actuator/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [hotel-net]

  # ── Application tier ───────────────────────────────────────────────────────────
  auth-service:
    <<: *service-defaults
    build:
      context: ./auth-service
    container_name: hotel-auth
    environment:
      <<: *service-env
      DB_SCHEMA: auth_service
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hotel.com}
      ADMIN_NAME: ${ADMIN_NAME:-Hotel Administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      # service_healthy, not just service_started: Hibernate would fail to connect and
      # the container would crash-loop if it started before Postgres accepted queries.
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - '${AUTH_PORT:-8081}:8081'

  room-service:
    <<: *service-defaults
    build:
      context: ./room-service
    container_name: hotel-rooms
    environment:
      <<: *service-env
      DB_SCHEMA: room_service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - '${ROOM_PORT:-8082}:8082'

  booking-service:
    <<: *service-defaults
    build:
      context: ./booking-service
    container_name: hotel-bookings
    environment:
      <<: *service-env
      DB_SCHEMA: booking_service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      # booking-service calls room-service to price a booking. It degrades gracefully
      # via its circuit-breaker fallback if room-service is down, but waiting here means
      # a fresh `up` does not greet you with avoidable 503s.
      room-service:
        condition: service_healthy
    ports:
      - '${BOOKING_PORT:-8083}:8083'

  api-gateway:
    <<: *service-defaults
    build:
      context: ./api-gateway
    container_name: hotel-gateway
    environment:
      <<: *service-env
      # Origins allowed to call the API from a browser. The frontend container talks to
      # the gateway through its own nginx proxy, so this only matters for `npm run dev`
      # and any deployed frontend domain.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4173}
    depends_on:
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      room-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    ports:
      - '${GATEWAY_PORT:-8080}:8080'

  # ── Presentation tier ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Empty on purpose: the app calls /api on its own origin and nginx proxies to
        # the gateway. See frontend/nginx.conf.
        VITE_API_BASE_URL: ''
    container_name: hotel-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    networks: [hotel-net]

networks:
  hotel-net:
    driver: bridge

volumes:
  postgres-data:
