server {
    listen 80;
    # Dual-stack: without this nginx answers only on IPv4, and anything resolving
    # `localhost` to ::1 inside the container gets connection refused.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # NOTE ON add_header: nginx does NOT merge add_header across levels. A location block
    # that declares any add_header of its own DISCARDS every add_header inherited from the
    # server block. So the security headers are repeated in each location that sets
    # caching, rather than declared once at server level — declaring them only at server
    # level silently dropped them from every HTML response, because try_files hands the
    # request to `location = /index.html`, which sets its own Cache-Control.

    # Hashed asset filenames are immutable, so they can be cached indefinitely.
    # Cache-Control is set only via add_header here; adding `expires` as well would emit a
    # second, conflicting Cache-Control header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a returning visitor keeps loading the old app
    # shell and requesting asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Proxy the API to the gateway so the browser stays on one origin and CORS is a
    # non-issue inside compose.
    location /api/ {
        proxy_pass http://api-gateway:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous: a cold-starting downstream service can legitimately take this long.
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Swagger UI, handy when running the whole stack from compose.
    location /swagger-ui/ {
        proxy_pass http://api-gateway:9080/swagger-ui/;
        proxy_set_header Host $host;
    }

    # SPA history fallback. Without this, a hard refresh on /my-bookings asks nginx for a
    # file that does not exist and returns 404 instead of letting React Router resolve it.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
